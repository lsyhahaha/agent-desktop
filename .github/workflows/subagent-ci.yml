name: Subagent validation

on:
  push:
    branches: [feature/subagent]
  pull_request:
    paths:
      - 'apps/runtime/**'
      - 'packages/protocol/**'
      - '.github/workflows/subagent-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Subagent lifecycle tests
        run: node --experimental-strip-types --test apps/runtime/src/agent-control.test.ts
